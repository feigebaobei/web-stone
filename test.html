f = (tree) => {
    let count = 0
    let sum = 0
    let childSum = (node) => {
        if (node.left || node.right) { // 非叶子
            childSum(node.left)
            childSum(node.right)
        } else {
            sum += node.value
        }
        return sum
    }
    let f = (node) => {
        if (!node.left && !node.right) {
            // 叶子节点是平衡的
            return
        } else {
            f(node.left)
            f(node.right)
            let l = childSum(node.left)
            sum = 0
            let r = childSum(node.right)
            sum = 0
            if (l !== r) {
                count++
            }
        }
    }
    return count
}
f = (paiList) => {

    let check = (paiList) => {
        for (let i = 1; i < paiList.length; i++) {
            let j = i - 3
            let stackI = paiList[i]
            let stackJ = paiList[j]
            // [顶.....底]
            if (
                j > -1 &&
                (stackI[0].suit === stackJ[0].suit
                || stackI[0].rank === stackJ[0].rank)
            ) {
                return {
                    index: i,
                    target: j
                }
            } else {
                j = i - 1
                stackJ = paiList[j]
                if (
                    j > -1
                    && (stackI[0].suit === stackJ[0].suit
                    || stackI[0].rank === stackJ[0].rank)
                ) {
                    return {
                        index: i,
                        target: j
                    }
                }
            }
        }
    }
    let move = (cur) => {
        paiList[cur.target].unshift(paiList[cur.index].shift())
        if (paiList[cur.index].length) {} else {
            paiList.splice(cur.index, 1)
        }
    }
    let cur
    do {
        cur = check()
        if (cur) {
            move(cur)
        }
    } while (cur)
    return paiList
}

f = (r, c, valueList) => {
    let metrix = []
    let t
    t = valueList.splice(0, c)
    while (t.length) {
        metrix.push([...t])
        t = valueList.splice(0, c)
    }
    let isExp = (v) => {
        let reg = /[a-zA-Z]/g
        return reg.test(v)
    }
    let rMap = new Map([
        ['A', 0],
        ['B', 1],
        ['C', 2],
        ['D', 3],
        ['E', 4],
        ['F', 5],
        ['G', 6],
        ['H', 7],
        ['I', 8],
        ['J', 9],
        ['K', 10],
        ['L', 11],
        ['M', 12],
        ['N', 13],
        ['O', 14],
        ['P', 15],
        ['Q', 16],
        ['R', 17],
        ['S', 18],
        ['T', 19],
    ])
    let calc = (i, j) => {
        if (isExp(metrix[i][j])) {
            let r = /[\+\-]/g
            let arr = metrix[i][j].split(/[\+\-]/)
            let signList = metrix[i][j].match(r) // null | [xx]
            let valueList = arr.map(item => {
                if (isExp(item)) {
                    let [r, c] = item.split('')
                    return metrix[rMap.get(r)][Number(c)] = calc(rMap.get(r), Number(c))
                } else {
                    return Number(item)
                }
            })
            return valueList.reduce((r, c, i) => {
                switch (signList[i - 1]) {
                    case '+':
                        r += c
                        break;
                    case '-':
                        r -= c
                        break;
                }
                return r
            })
        } else {
            return Number(metrix[i][j])
        }
    }
    for (let i = 0; i < metrix.length; i++) {
        for (let j = 0; j < metrix[0].length; j++) {
            metrix[i][j] = calc(i, j)
        }
    }
    return metrix
}
