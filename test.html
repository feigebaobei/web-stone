    }

f = (paiList) => {
    // paiList: {
    //     rank: 1, // 1-13
    //     suit: 'red', // 'red'/'black'/'fang'/'mei'
    // }[][]
    let check = (paiList) => {
        for (let i = 1; i < paiList.length; i++) {
            let j = i - 3
            let stackI = paiList[i]
            let stackJ = paiList[j]
            // [顶.....底]
            if (
                j > -1 &&
                (stackI[0].suit === stackJ[0].suit
                || stackI[0].rank === stackJ[0].rank)
            ) {
                return {
                    index: i,
                    target: j
                }
            } else {
                j = i - 1
                stackJ = paiList[j]
                if (
                    j > -1
                    && (stackI[0].suit === stackJ[0].suit
                    || stackI[0].rank === stackJ[0].rank)
                ) {
                    return {
                        index: i,
                        target: j
                    }
                }
            }
        }
    }
    let move = (cur) => {
        paiList[cur.target].unshift(paiList[cur.index].shift())
        if (paiList[cur.index].length) {} else {
            paiList.splice(cur.index, 1)
        }
    }
    let cur
    do {
        cur = check()
        if (cur) {
            move(cur)
        }
    } while (cur)
    return paiList
}
f = (map, start, topNumber, frontNumber) => {

        top: topNumber,
        bottom: 7 - topNumber,
        left: 0, //topNumber <= 3 ? ,
        right: 0,
        front: frontNumber,
        end: 7 - frontNumber,
    }
    let tArr = []
    for (let i = 1; i < 7; i++) {
        if ([se.top,
            se.bottom,
            se.front,
            se.end,
        ].includes(i)) {} else {
            tArr.push(i)
        }

    if (topNumber <= 3) {

        se.right = tArr[0]
    } else {

        se.right = tArr[1]

    let seLeft = () => {
        [se.top, se.right, se.bottom, se.left] = [se.right, se.bottom, se.left, se.top]
    }
    let seRight = () => {
        [se.top, se.right, se.bottom, se.left] = [se.left, se.top, se.right, se.bottom]
    }
    let seFront = () => {
        [se.top, se.end, se.bottom, se.front] = [se.end, se.bottom, se.front, se.top]
    }
    let seEnd = () => {
        [se.top, se.end, se.bottom, se.front] = [se.front, se,bottom, se.end, se.top]
    }

    let _f = (choice, status) => {
        for (let i = 0; i < choice.length; i++) {
            if (choice[i]) {

                switch (i) {
                    case 0:

                        }
                    case 1:

                            seFront()
                        }
                    case 2:
                        if (choice[i][0] === se.left || choice[i][0] === '*') {
                            seLeft()
                        }
                    case 3:

                            seEnd()
                        }

        r = i

        } else { status.push()}
        return status // 右 下 左 上
        // 右 前 左 后
